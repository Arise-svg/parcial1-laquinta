<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Quinta · Control de despachos</title>
<style>
  :root{--bg:#f4f6f8;--card:#fff;--ink:#1f2d3d;--mut:#6b7785;--line:#d9dee4;--navy:#1f3a5f;
        --ok:#1e7a3c;--okbg:#e6f4ea;--warn:#8a5a00;--warnbg:#fff4dc;--bad:#b0413e;--badbg:#fdecea;--gray:#eef1f4}
  @media (prefers-color-scheme:dark){:root{--bg:#10151b;--card:#18202a;--ink:#e6ebf0;--mut:#9aa6b2;--line:#2b3744;--navy:#7fa7d1;
        --okbg:#14301f;--warnbg:#3a2d10;--badbg:#3a1a19;--gray:#222c37}}
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--navy);color:#fff;padding:14px 20px}
  header h1{margin:0;font-size:18px} header p{margin:2px 0 0;font-size:12px;opacity:.85}
  nav{display:flex;gap:6px;padding:10px 20px 0;max-width:980px;margin:auto}
  nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:8px 8px 0 0;cursor:pointer;font-size:14px}
  nav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  main{max-width:980px;margin:auto;padding:0 20px 40px}
  section{background:var(--card);border:1px solid var(--line);border-radius:0 8px 8px 8px;padding:20px}
  .hide{display:none}
  form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px;font-weight:600}
  input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;font-size:14px;background:var(--card);color:var(--ink)}
  .full{grid-column:1/-1}
  button.send{background:var(--navy);color:#fff;border:0;padding:12px 22px;border-radius:6px;font-size:15px;cursor:pointer}
  button.send:disabled{opacity:.5;cursor:wait}
  #resultado{margin-top:18px;padding:16px;border-radius:8px;border:1px solid var(--line)}
  #resultado h2{margin:0 0 6px;font-size:20px} #resultado p{margin:3px 0;font-size:14px}
  .APROBADO{background:var(--okbg);border-color:#9ccfab;color:var(--ok)}
  .ALERTA{background:var(--warnbg);border-color:#e8c97a;color:var(--warn)}
  .RECHAZADO{background:var(--badbg);border-color:#e5a8a0;color:var(--bad)}
  .RESPALDO{background:var(--gray);color:var(--ink)}
  .tablewrap{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap} th{background:var(--gray)}
  .bar{display:flex;gap:10px;align-items:center;margin-bottom:10px} .bar small{color:var(--mut)}
  .bar button{padding:7px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer}
  @media(max-width:640px){form{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Distribuidora La Quinta S.A.S. · Control de despachos</h1>
  <p>consulta el inventario, calcula el saldo y decide si el despacho procede.</p>
</header>
<nav>
  <button class="on" data-v="registro">Registro de despacho</button>
  <button data-v="historial">Historial de movimientos</button>
  <button data-v="inventario">Inventario (opcional)</button>
</nav>
<main>
  <section id="registro">
    <form id="f">
      <div><label for="solicitante">Solicitante</label><input id="solicitante" required></div>
      <div><label for="correo">Correo</label><input id="correo" type="email" required></div>
      <div><label for="codigo_producto">Código del producto</label>
        <input id="codigo_producto" list="codigos" placeholder="INS-0101" required>
        <datalist id="codigos"><option value="INS-0101"><option value="INS-0102"><option value="INS-0203"><option value="INS-0204"><option value="INS-0305"><option value="INS-0306"><option value="INS-0407"><option value="INS-0408"></datalist></div>
      <div><label for="cantidad">Cantidad</label><input id="cantidad" type="number" min="1" step="1" required></div>
      <div><label for="destino">Destino</label><input id="destino" required></div>
      <div><label for="motivo">Motivo</label>
        <select id="motivo" required><option value="despacho">despacho</option><option value="traslado entre sedes">traslado entre sedes</option><option value="avería">avería</option></select></div>
      <div class="full"><button class="send" id="btn" type="submit">Registrar despacho</button></div>
    </form>
    <div id="resultado" class="hide"></div>
  </section>

  <section id="historial" class="hide">
    <div class="bar"><button id="r1">Actualizar</button><small id="s1"></small></div>
    <div class="tablewrap"><table id="t1"></table></div>
  </section>

  <section id="inventario" class="hide">
    <div class="bar"><button id="r2">Actualizar</button><small id="s2"></small></div>
    <div class="tablewrap"><table id="t2"></table></div>
  </section>
</main>

<script>
/* ====== CONFIGURACIÓN: pegar estos dos valores ====== */
const WEBHOOK_URL = "https://hook.us2.make.com/ws4ecirww94ydavw4xsu8etl8hnbjjlu";   //   pegar aqui la url de webhook de make V:
const SHEET_ID    = "1EMkPPFFPxVNK3m7wpHxUwxQfyaYXn6c0teOYjFkRHg4";   // la parte larga de la URL entre /d/ y /edit de hoja de google
/* ==================================================== */

const $ = id => document.getElementById(id);

// Pestañas
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  ["registro","historial","inventario"].forEach(v => $(v).classList.toggle("hide", v !== b.dataset.v));
  if (b.dataset.v === "historial") cargar("movimientos","t1","s1");
  if (b.dataset.v === "inventario") cargar("inventario","t2","s2");
});

// Hora de Bogotá con formato "2026-10-08 14:03:21" (el mismo que escribe Make en fecha_hora)
const ahora = () => new Date().toLocaleString("sv-SE", {timeZone:"America/Bogota"});

// Registro -> webhook de Make
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("btn"), box = $("resultado");
  btn.disabled = true; btn.textContent = "Procesando…"; box.className = "hide";
  const datos = new URLSearchParams({
    solicitante: $("solicitante").value.trim(),
    correo: $("correo").value.trim(),
    codigo_producto: $("codigo_producto").value.trim().toUpperCase(),
    cantidad: String(parseInt($("cantidad").value, 10)),
    destino: $("destino").value.trim(),
    motivo: $("motivo").value,
    fecha_solicitud: ahora()
  });
  try {
    const r = await fetch(WEBHOOK_URL, {method:"POST", body: datos});   // form-urlencoded: no dispara preflight
    const txt = await r.text();
    let d; try { d = JSON.parse(txt); } catch { d = null; }
    if (!d) throw new Error("Make respondió algo que no es JSON: " + txt.slice(0,120) + ". ¿El escenario está activo o en Run once?");
    mostrar(d);
  } catch (err) {
    box.className = "RECHAZADO"; box.innerHTML = "<h2>No se pudo completar</h2><p>" + err.message + "</p>";
  } finally { btn.disabled = false; btn.textContent = "Registrar despacho"; }
});

function mostrar(d){
  const box = $("resultado");
  const clase = d.resultado === "APROBADO" ? "APROBADO" : d.resultado === "APROBADO CON ALERTA" ? "ALERTA" : d.resultado === "RECHAZADO" ? "RECHAZADO" : "RESPALDO";
  let html = "<h2>" + (d.resultado || "RESPUESTA") + "</h2><p>" + (d.mensaje || "") + "</p>";
  if (d.producto) html += "<p><b>" + d.codigo + "</b> · " + d.producto + "</p>";
  if (d.saldo_anterior !== undefined && d.saldo_anterior !== "")
    html += "<p>Existencias " + d.saldo_anterior + " − cantidad " + d.cantidad + " = saldo <b>" + d.saldo_resultante + "</b> (mínimo " + d.minimo + ")</p>";
  box.className = clase; box.innerHTML = html;
}

// Lectura de las hojas (publicadas como "cualquiera con el enlace puede ver")
function csv(t){
  const rows=[]; let r=[], c="", q=false;
  for (let i=0;i<t.length;i++){ const ch=t[i];
    if (q){ if(ch==='"'){ if(t[i+1]==='"'){c+='"';i++;} else q=false; } else c+=ch; }
    else if (ch==='"') q=true;
    else if (ch===','){ r.push(c); c=""; }
    else if (ch==='\n'){ r.push(c); rows.push(r); r=[]; c=""; }
    else if (ch!=='\r') c+=ch;
  }
  if (c!==""||r.length){ r.push(c); rows.push(r); }
  return rows;
}
async function cargar(hoja, tabla, estado){
  $(estado).textContent = "Cargando…";
  try {
    const url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(hoja);
    const rows = csv(await (await fetch(url)).text());
    const head = rows.shift() || [];
    if (hoja === "movimientos") rows.reverse();               // lo más reciente primero
    $(tabla).innerHTML = "<tr>" + head.map(h => "<th>" + h + "</th>").join("") + "</tr>" +
      rows.map(r => "<tr>" + r.map(x => "<td>" + x + "</td>").join("") + "</tr>").join("");
    $(estado).textContent = rows.length + " filas · " + ahora();
  } catch (e) { $(estado).textContent = "No se pudo leer la hoja: revisen SHEET_ID y que esté compartida como 'cualquiera con el enlace: lector'."; }
}
$("r1").onclick = () => cargar("movimientos","t1","s1");
$("r2").onclick = () => cargar("inventario","t2","s2");
</script>
</body>
</html>
